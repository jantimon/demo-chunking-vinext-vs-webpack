<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#0c0c0e;color:#e9e7e2;overflow:hidden;position:relative;font-family:"JetBrains Mono",monospace}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 380px at 10% -40px,rgb(91 156 255/.16),transparent 70%),radial-gradient(600px 380px at 90% 0,rgb(255 138 61/.14),transparent 70%)}
.in{position:relative;padding:64px 72px}
.k{font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#a3a09a;display:flex;gap:8px;align-items:center}
.k i{width:12px;height:12px;border-radius:50%;display:inline-block}
h1{font:800 92px/.92 "Bricolage Grotesque";letter-spacing:-.04em;margin:26px 0 40px}
h1 span{color:#ff8a3d}
.row{display:grid;grid-template-columns:150px 1fr 90px;gap:16px;align-items:center;margin:12px 0;font-size:20px}
.sq{display:flex;flex-wrap:wrap;gap:2px;width:820px}
.sq b{width:6px;height:6px;border-radius:1px;display:block}
.n{font:800 34px "Bricolage Grotesque"}
</style></head><body><div class="in">
<div class="k"><i style="background:#5b9cff"></i><i style="background:#ff8a3d"></i>&nbsp;webpack × Rolldown · Next.js Pages Router</div>
<h1>Same code,<br><span>ten times the files</span></h1>
<div class="row"><span>webpack</span><div class="sq" id="w"></div><span class="n" style="color:#5b9cff">55</span></div>
<div class="row"><span>Rolldown</span><div class="sq" id="r"></div><span class="n" style="color:#ff8a3d">576</span></div>
</div><script>
w.innerHTML='<b style="background:#5b9cff"></b>'.repeat(55); r.innerHTML='<b style="background:#ff8a3d"></b>'.repeat(576);
</script></body></html>
